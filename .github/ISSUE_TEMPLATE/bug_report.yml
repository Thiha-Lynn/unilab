name: 🐛 Bug report
description: A tool broke, produced a wrong result, or hung
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Compress Image
        - Resize Image
        - Crop Image
        - Convert Image
        - Images → PDF
        - HEIC to JPG
        - Merge PDF
        - Split PDF
        - Compress PDF
        - PDF → Images
        - Organize PDF
        - Watermark PDF
        - Page Numbers
        - Word Counter
        - Citation Generator
        - GPA Calculator
        - Focus Timer
        - QR Code Maker
        - Unit Converter
        - The site itself (home page, PWA, offline…)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: "I dropped a 3-page scanned PDF into Compress PDF, chose Balanced, and it stayed on 'Page 1/3' forever."
    validations:
      required: true
  - type: textarea
    id: file-details
    attributes:
      label: About the file (do NOT upload private documents)
      description: Type, size, page count, language/script of the content, where it came from (phone scan, Word export…). A screenshot of the error is great — a screenshot of your transcript is not.
      placeholder: "12 MB scanned PDF, 40 pages, Thai + English, scanned with CamScanner"
  - type: input
    id: browser
    attributes:
      label: Browser & device
      placeholder: "Chrome 130 on Android 14 / Safari on iPhone 15"
    validations:
      required: true
